# Lytter på 8000, fordi det er serverens kontrakt. Caddy står foran og
# terminerer HTTPS, containeren skal kun tale almindelig HTTP.
server {
    listen 8000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sundhedstjek til deploy.sh og Uptime Kuma, samme konvention som
    # Django projekterne på serveren. Svarer uden at røre filsystemet.
    location = /sundhed/ {
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
